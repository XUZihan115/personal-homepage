<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="徐子涵的个人主页 —— 先选一下你是用手机还是电脑打开" />
    <meta name="theme-color" content="#e2f6f4" />
    <title>选择设备 · 徐子涵</title>
    <link rel="stylesheet" href="style.css" />

    <!-- ===== 记忆判断：必须放在最前面 =====
         写在 <head> 里、且在浏览器开始画页面之前跑，命中记忆就直接 replace 走人，
         所以老访客连「闪一下选择页」都不会看到。
         带 ?switch=1 是点「换设备」主动回来的，这种时候必须让选择页正常显示。 ===== -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("xz_device");
        } catch (e) {
          saved = null; // 隐私模式里 localStorage 可能直接抛错，当作没选过
        }

        var force = String(location.search || "").indexOf("switch=1") >= 0;

        if (!force && (saved === "mobile" || saved === "desktop")) {
          location.replace(saved === "mobile" ? "mobile.html" : "desktop.html");
        }
      })();
    </script>

    <style>
      /* 选择页自己的一小段样式。
         底色、网格、光晕、字体、圆角全部复用 style.css 的变量和 .backdrop，
         所以主页换配色时这里会自动跟着变，不用改第二遍。 */
      body.choose-page {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 20px;
        font-family: var(--sans);
        color: var(--text);
      }

      .choose {
        position: relative;
        z-index: 10;
        width: min(560px, 100%);
        text-align: center;
      }

      .choose-eyebrow {
        margin: 0 0 14px;
        font-family: var(--serif);
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .choose-title {
        margin: 0 0 12px;
        font-size: clamp(25px, 6.2vw, 35px);
        font-weight: 600;
        line-height: 1.32;
        letter-spacing: 0.01em;
      }

      .choose-title b {
        font-weight: 600;
        background: linear-gradient(100deg, var(--accent), var(--accent-2) 48%, var(--pink));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .choose-sub {
        margin: 0 auto 30px;
        max-width: 30em;
        font-size: 13.5px;
        line-height: 1.75;
        color: var(--muted);
      }

      .choose-btns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      /* 每个选项是一张卡：左边圆图标，中间标题 + 一句说明，右上角挂「推荐」 */
      .pick {
        position: relative;
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 17px 18px;
        font-family: inherit;
        text-align: left;
        color: var(--text);
        background: linear-gradient(165deg, var(--card-top), var(--card) 60%);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        cursor: pointer;
        transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      }

      .pick:hover,
      .pick:focus-visible {
        transform: translateY(-2px);
        border-color: var(--amber);
        box-shadow: var(--shadow), 0 0 0 3px var(--amber-soft);
        outline: none;
      }

      .pick-ic {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        color: var(--accent);
        background: var(--amber-soft);
      }

      .pick-ic svg {
        width: 21px;
        height: 21px;
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .pick-txt {
        min-width: 0;
        display: block;
      }

      .pick-txt b {
        display: block;
        font-size: 15.5px;
        font-weight: 600;
        line-height: 1.4;
      }

      .pick-txt i {
        display: block;
        margin-top: 2px;
        font-size: 11.5px;
        font-style: normal;
        line-height: 1.5;
        color: var(--dim);
      }

      .pick-badge {
        position: absolute;
        top: -8px;
        right: 12px;
        padding: 2px 8px;
        font-size: 10.5px;
        line-height: 1.6;
        border-radius: 999px;
        color: var(--card);
        background: var(--amber);
      }

      .pick-badge[hidden] {
        display: none;
      }

      .choose-note {
        margin: 24px 0 0;
        font-size: 12px;
        line-height: 1.7;
        color: var(--dim);
      }

      /* 窄屏：两个选项竖着摞，别挤成并排 */
      @media (max-width: 560px) {
        .choose-btns {
          grid-template-columns: 1fr;
        }
        .pick {
          padding: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .pick {
          transition: none;
        }
        .pick:hover,
        .pick:focus-visible {
          transform: none;
        }
      }
    </style>
  </head>

  <body class="bg-sun choose-page">
    <!-- 背景：和主页同一套（淡网格 + 光晕 + 暗角），色调跟着 body.bg-sun 走 -->
    <div class="backdrop" aria-hidden="true">
      <div class="grid"></div>
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
      <div class="vignette"></div>
    </div>

    <main class="choose">
      <p class="choose-eyebrow">徐子涵 · 个人主页</p>
      <h1 class="choose-title">你是用<b>什么设备</b>打开的？</h1>
      <p class="choose-sub">选一次就记住了，下次打开直接进对应版本。之后想换，点页面里的「换设备」。</p>

      <!-- 用 <a> 而不是 <button>：脚本没跑起来时点一下照样能进对应版本，
           只是不记记忆而已（JS 负责把选择写进 localStorage，不拦默认跳转）。 -->
      <div class="choose-btns">
        <a class="pick" href="mobile.html" data-pick="mobile">
          <span class="pick-ic" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.4" /><path d="M11 18.4h2" /></svg>
          </span>
          <span class="pick-txt">
            <b>手机</b>
            <i>单列排版，按钮放大</i>
          </span>
          <span class="pick-badge" id="badgeMobile" hidden>推荐</span>
        </a>

        <a class="pick" href="desktop.html" data-pick="desktop">
          <span class="pick-ic" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="12.5" rx="2.2" /><path d="M9 20h6" /><path d="M12 16.5V20" /></svg>
          </span>
          <span class="pick-txt">
            <b>电脑</b>
            <i>三列卡片，可拖拽摆放</i>
          </span>
          <span class="pick-badge" id="badgeDesktop" hidden>推荐</span>
        </a>
      </div>

      <p class="choose-note" id="chooseNote">选择后会记住，下次直接进入</p>
    </main>

    <script>
      (function () {
        "use strict";

        /* 按当前屏幕宽窄给个「推荐」角标 —— 只是提示，不替用户做决定，
           点哪个还是听用户的。 */
        var narrow = false;
        try {
          narrow = window.matchMedia("(max-width: 900px)").matches;
        } catch (e) {
          narrow = false;
        }
        var bm = document.getElementById("badgeMobile");
        var bd = document.getElementById("badgeDesktop");
        if (bm && narrow) bm.hidden = false;
        if (bd && !narrow) bd.hidden = false;

        /* 点哪个就把哪个记下来。故意不 preventDefault：
           记忆写失败（隐私模式等）也照样跳到对应页面，不会把人卡在这一页。 */
        var picks = [].slice.call(document.querySelectorAll(".pick"));
        var note = document.getElementById("chooseNote");

        function remember(e) {
          var mode = e.currentTarget.getAttribute("data-pick");
          var ok = true;
          try {
            localStorage.setItem("xz_device", mode);
          } catch (err) {
            ok = false;
          }
          // 存不下就吱一声，免得用户以为「记住」生效了
          if (!ok && note) {
            note.textContent = "这个浏览器不让记记忆，下次还得再选一次";
          }
        }

        for (var i = 0; i < picks.length; i++) {
          picks[i].addEventListener("click", remember);
        }
      })();
    </script>
  </body>
</html>
