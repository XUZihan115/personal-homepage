<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="徐子涵的个人主页">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d3b3a" />
      <stop offset="1" stop-color="#0891b2" />
    </linearGradient>
    <!-- 用遮罩从圆盘上咬掉一口，剩下一个月牙 -->
    <mask id="crescent">
      <rect width="64" height="64" fill="#fff" />
      <circle cx="42" cy="24" r="16" fill="#000" />
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)" />
  <circle cx="31" cy="34" r="18" fill="#e2f6f4" mask="url(#crescent)" />
  <circle cx="20" cy="17" r="2.6" fill="#7dd3fc" />
  <circle cx="47" cy="48" r="1.9" fill="#7dd3fc" />
</svg>
